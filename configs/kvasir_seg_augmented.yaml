# Kvasir-SEG — augmentation-ablation "treatment" arm.
#
# Same images/masks as configs/kvasir_seg.yaml. Pairs with
# configs/kvasir_seg_no_aug.yaml to isolate the effect of the
# HorizontalFlip/VerticalFlip training augmentations on validation
# Dice/IoU for the vanilla U-Net.
#
# Unlike configs/kvasir_seg.yaml (which reuses one `transforms:` pipeline
# for both train and val, so val samples get randomly flipped too), this
# config splits train_transforms/val_transforms: only the train split sees
# the flips, so val is a deterministic, noise-free measurement in both arms
# of the ablation. `transforms:` (no split) is kept as the val-equivalent
# default for direct load_dataset()/test usage, matching mass_roads.yaml's
# convention.

dataset_name: kvasir-seg-augmented

images_dir: data/kvasir-seg/Kvasir-SEG/images
masks_dir:  data/kvasir-seg/Kvasir-SEG/masks
image_ext:  .jpg
mask_ext:   .jpg

strict_pairing: true
mask_threshold: 127

transforms:
  - name: Resize
    height: 512
    width: 512
  - name: Normalize
    mean: [0.485, 0.456, 0.406]
    std:  [0.229, 0.224, 0.225]
    max_pixel_value: 255.0
  - name: ToTensorV2

train_transforms:
  - name: Resize
    height: 512
    width: 512
  - name: HorizontalFlip
    p: 0.5
  - name: VerticalFlip
    p: 0.5
  - name: Normalize
    mean: [0.485, 0.456, 0.406]
    std:  [0.229, 0.224, 0.225]
    max_pixel_value: 255.0
  - name: ToTensorV2

val_transforms:
  - name: Resize
    height: 512
    width: 512
  - name: Normalize
    mean: [0.485, 0.456, 0.406]
    std:  [0.229, 0.224, 0.225]
    max_pixel_value: 255.0
  - name: ToTensorV2
