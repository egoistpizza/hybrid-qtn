# DUTS salient object detection benchmark config
#
# Layout expected after running `python -m scripts.download_duts`:
#   data/duts/train/duts_tr/{images,masks}   10,553 DUTS-TR pairs
#   data/duts/test/duts_te/{images,masks}     5,019 DUTS-TE pairs
#
# Official protocol: DUTS-TR for training, DUTS-TE for testing. Validation is carved
# from DUTS-TR, so DUTS-TE is never used for model selection; see dataset/predefined.py.
# Images are at most 400 px on their longer side, so the 512 x 512 input upsamples them.

dataset_name: duts

image_ext: .jpg
mask_ext:  .png
strict_pairing: true
mask_threshold: 127
# Also report S-measure, E-measure, weighted F-measure and MAE at ground-truth resolution.
foreground_map_metrics: true

sources:
  duts_tr:
    images_dir: data/duts/train/duts_tr/images
    masks_dir:  data/duts/train/duts_tr/masks
  duts_te:
    images_dir: data/duts/test/duts_te/images
    masks_dir:  data/duts/test/duts_te/masks

train_sources: [duts_tr]
test_sources: [duts_te]
validation_fraction: 0.1

# Natural images have a canonical orientation, so only horizontal flips are used.
# Kept identical to configs/cod.yaml, so the two natural-image benchmarks share one pipeline.
train_transforms:
  - name: Resize
    height: 512
    width: 512
  - name: HorizontalFlip
    p: 0.5
  - name: Normalize
    mean: [0.485, 0.456, 0.406]
    std:  [0.229, 0.224, 0.225]
    max_pixel_value: 255.0
  - name: ToTensorV2

eval_transforms:
  - name: Resize
    height: 512
    width: 512
  - name: Normalize
    mean: [0.485, 0.456, 0.406]
    std:  [0.229, 0.224, 0.225]
    max_pixel_value: 255.0
  - name: ToTensorV2
