# CVC-ClinicDB dataset config
#
# Layout expected after running `python scripts/download_cvc_clinicdb.py`:
#   data/cvc-clinicdb/CVC-ClinicDB/Original/*.png
#   data/cvc-clinicdb/CVC-ClinicDB/Ground Truth/*.png
#
# 612 frames from 29 colonoscopy sequences, natively 384x288.

# Sequence-aware splitting. CVC-ClinicDB's 612 frames come from 29 colonoscopy
# sequences; frames within a sequence are near-duplicates of one polyp. Splitting
# by frame put a same-sequence sibling in train for 123/123 validation frames.
# Whole sequences are now assigned to one side only. See dataset/groups.py.
group_map:
  csv: configs/cvc_clinicdb_sequences.csv
  sample_column: sample_id
  group_column: sequence_id

dataset_name: cvc-clinicdb

# Quoted: "Ground Truth" contains a space.
images_dir: "data/cvc-clinicdb/CVC-ClinicDB/Original"
masks_dir:  "data/cvc-clinicdb/CVC-ClinicDB/Ground Truth"
image_ext:  .png
mask_ext:   .png

# Pairing behavior. When true, an unpaired image or mask raises.
# Set to false to warn + skip instead.
strict_pairing: true

# Raw mask is grayscale 0-255; values strictly greater than this threshold
# become foreground (1.0), the rest background (0.0). ClinicDB masks are
# 0/255 with antialiased edges, so 127 binarizes cleanly.
mask_threshold: 127

# Albumentations pipeline. Applied jointly to image and mask.
# Kept byte-identical to configs/kvasir_seg.yaml so the ablation is controlled.
transforms:
  - name: Resize
    height: 512
    width: 512
  - name: HorizontalFlip
    p: 0.5
  - name: VerticalFlip
    p: 0.5
  - name: Normalize
    mean: [0.485, 0.456, 0.406]
    std:  [0.229, 0.224, 0.225]
    max_pixel_value: 255.0
  - name: ToTensorV2
